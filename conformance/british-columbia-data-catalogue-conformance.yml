      Documented in DataBC's own API how-to and present in the first-party spec.
domain_standards:
  - id: ogc-ows
    name: OGC Web Services (WMS/WFS) — the geospatial domain standard
    conforms: true
    evidence: https://openmaps.gov.bc.ca/geo/pub/ows?service=WFS&request=GetCapabilities&version=2.0.0
    spec_location: >-
      openapi/british-columbia-data-catalogue-databc-pub-wfs-capabilities.xml —
      root element wfs:WFS_Capabilities, namespace http://www.opengis.net/wfs/2.0,
      ows:ServiceIdentification/ows:ServiceType = WFS
    detail: >-
      884 of the catalogue's datasets publish a WMS resource pointing at this endpoint, so
      a GIS client that already speaks WFS/WMS consumes B.C. spatial data with no bespoke
      connector. This is the contract DECLARING the standard, not a prose claim.
