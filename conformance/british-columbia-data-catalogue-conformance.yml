  - id: oauth2
    name: OAuth 2.0
    conforms: false
    evidence: https://raw.githubusercontent.com/bcgov/api-specs/master/bcdc/bcdc.json
    detail: >-
      The spec carries an oauth2 securityScheme named githubAccessCode whose
      authorizationUrl is github.com/login/oauth/authorize and whose scope list is
      GitHub's own (repo, gist, delete_repo, admin:org). It is Swagger-editor boilerplate,
      not a BC Data Catalogue authorization server, and is recorded here as
      non-conformant so it is never read as a BC OAuth surface. The catalogue's real
      sign-in is an OpenID Connect SSO plugin (the "sso" extension listed by status_show).
  - id: pagination
