openapi: 3.2.0
info:
  version: '1.0'
  title: BC Gov News API Service 1.0 Services API
  description: News API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://news.api.gov.bc.ca/
tags:
- name: Services
paths:
  /api/Services:
    get:
      tags:
      - Services
      summary: Get all Services
      operationId: Services_GetAll
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
  /api/Services/{key}:
    get:
      tags:
      - Services
      summary: Get the service associated with the passed key
      operationId: Services_GetOne
      parameters:
      - name: key
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Service'
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
            text/json:
              schema:
                $ref: '#/components/schemas/Service'
components:
  schemas:
    DataIndex:
      type: object
      allOf:
      - $ref: '#/components/schemas/DataModel'
      properties:
        kind:
          type: string
        name:
          type: string
        topPostKey:
          type: string
        featurePostKey:
          type: string
    Service:
      type: object
      allOf:
      - $ref: '#/components/schemas/Category'
      properties:
        twitterFeedUsername:
          type: string
        flickrUri:
          type: string
        youtubeUri:
          type: string
        audioUri:
          type: string
        isActive:
          type: boolean
        name:
          type: string
        topPostKey:
          type: string
        featurePostKey:
          type: string
    Category:
      type: object
      allOf:
      - $ref: '#/components/schemas/DataIndex'
      properties:
        twitterFeedUsername:
          type: string
        flickrUri:
          type: string
        youtubeUri:
          type: string
        audioUri:
          type: string
        isActive:
          type: boolean
        name:
          type: string
        topPostKey:
          type: string
        featurePostKey:
          type: string
    DataModel:
      type: object
      properties:
        key:
          type: string
        timestamp:
          format: date-time
          type: string
x-provenance:
  method: harvested
  publisher: British Columbia Data Catalogue
  source: https://raw.githubusercontent.com/bcgov/api-specs/master/news/news-oas3.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
