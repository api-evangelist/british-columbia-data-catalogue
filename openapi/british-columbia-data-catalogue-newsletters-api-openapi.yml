openapi: 3.2.0
info:
  version: '1.0'
  title: BC Gov News API Service 1.0 Newsletters API
  description: News API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://news.api.gov.bc.ca/
tags:
- name: Newsletters
paths:
  /api/Newsletters:
    get:
      tags:
      - Newsletters
      summary: Get all newsletters
      operationId: Newsletters_GetAll
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Newsletter'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Newsletter'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Newsletter'
  /api/Newsletters/{newsletterKey}:
    get:
      tags:
      - Newsletters
      summary: Get a specific newsletter
      operationId: Newsletters_GetOne
      parameters:
      - name: newsletterKey
        in: path
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Newsletter'
            application/json:
              schema:
                $ref: '#/components/schemas/Newsletter'
            text/json:
              schema:
                $ref: '#/components/schemas/Newsletter'
  /api/Newsletters/{newsletterKey}/Editions/{editionKey}:
    get:
      tags:
      - Newsletters
      summary: Returns a specific edition of a newsletter
      operationId: Newsletters_GetEdition
      parameters:
      - name: newsletterKey
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: editionKey
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Edition'
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'
            text/json:
              schema:
                $ref: '#/components/schemas/Edition'
  /api/Newsletters/{newsletterKey}/Editions/{editionKey}/Articles/{articleKey}:
    get:
      tags:
      - Newsletters
      summary: Get an article belonging to a Newsletter edition
      operationId: Newsletters_GetArticle
      parameters:
      - name: newsletterKey
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: editionKey
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: articleKey
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Article'
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
            text/json:
              schema:
                $ref: '#/components/schemas/Article'
  /api/Newsletters/Images/{guid}:
    get:
      tags:
      - Newsletters
      summary: Get the image object reference by of a Newsletter Edition associated with the…
      operationId: Newsletters_GetImage
      parameters:
      - name: guid
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/EditionImage'
            application/json:
              schema:
                $ref: '#/components/schemas/EditionImage'
            text/json:
              schema:
                $ref: '#/components/schemas/EditionImage'
components:
  schemas:
    Article:
      type: object
      allOf:
      - $ref: '#/components/schemas/DataModel'
      properties:
        editionName:
          type: string
        htmlBody:
          type: string
    DataModel:
      type: object
      properties:
        key:
          type: string
        timestamp:
          format: date-time
          type: string
    KeyValuePair_2:
      type: object
      properties:
        key:
          type: string
          readOnly: true
        value:
          type: string
          readOnly: true
    Edition:
      type: object
      allOf:
      - $ref: '#/components/schemas/DataModel'
      properties:
        name:
          type: string
        htmlBody:
          type: string
    Newsletter:
      type: object
      allOf:
      - $ref: '#/components/schemas/DataModel'
      properties:
        name:
          type: string
        ministryName:
          type: string
        description:
          type: string
        editions:
          type: array
          items:
            $ref: '#/components/schemas/KeyValuePair_2'
    EditionImage:
      type: object
      allOf:
      - $ref: '#/components/schemas/DataModel'
      properties:
        fileName:
          type: string
        imageBytes:
          format: byte
          type: string
        imageType:
          type: string
