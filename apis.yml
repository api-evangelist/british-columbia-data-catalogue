- aid: british-columbia-data-catalogue:databc-public-ogc-services
  baseURL: https://openmaps.gov.bc.ca/geo/pub/ows
  name: DataBC Public OGC Web Services (WMS/WFS)
  description: >-
    DataBC's public OGC endpoint serves the spatial half of the BC Data Catalogue: 895 queryable WMS 1.3.0
    layers and 896 WFS 2.0.0 feature types drawn from the BC Geographic Warehouse. 884 catalogue datasets
    carry a resource pointing at this host, and a resource's object_name (for example WHSE_LAND_AND_NATURAL_RESOURCE.PROT_CURRENT_FIRE_POLYS_SP)
    is the layer name here, so it is the join between catalogue metadata and live geometry. GetMap and
    GetFeature return PNG, GeoJSON, TopoJSON, UTFGrid, KML, PDF or Atom. No key and no account. The contract
    is the GetCapabilities document itself, saved verbatim in this repo; the service names DataBC as its
    ows:ServiceProvider (datamaps@gov.bc.ca).
  humanURL: >-
    https://www2.gov.bc.ca/gov/content/data/geographic-data-services/web-based-mapping/map-services
  tags:
  - Geospatial
  - OGC
  - WMS
  - WFS
  - Open Data
  properties:
