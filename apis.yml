  - url: https://catalogue.data.gov.bc.ca/api/3
    type: BaseURL
  description: >-
    The BC Data Catalogue exposes a CKAN v3 REST API at https://catalogue.data.gov.bc.ca/api/3/action/
    providing programmatic access to BC government open datasets. Key endpoints include package_list (list
    all datasets), package_search (search datasets by query), package_show (retrieve dataset metadata
    and resources), organization_list (list BC government organizations), and resource_show (retrieve
    specific data resource information). Returns JSON with success status and result payloads. No authentication
    required for read access to public datasets.
