# REPLACES a 2026-05-04 bulk-sweep scaffold that invented Free / Professional /
# Enterprise tiers with per-minute quotas and TBD overage pricing for a free
# government open-data portal. None of that existed. See roadmap#35.
plan_count: 0
pricing_model: free-public-good
currency: null
plans: []
detail: >-
  The BC Data Catalogue publishes no plans, tiers, quotas or prices, and there is nothing
  to buy. It is a Government of British Columbia open-data service funded as a public
  good. DataBC's own API documentation states plainly: "You do not need an API key nor an
  account if you are only accessing publicly available data." Content published under the
  Open Government Licence — British Columbia is free to access, use, modify and
  redistribute with attribution.
access:
  read: open, unauthenticated, no account
  write: >-
    Requires a catalogue account with editor/publisher rights in a B.C. government
    organization. That is an internal-government entitlement, not a purchasable plan.
licence:
  name: Open Government Licence — British Columbia
  url: https://www2.gov.bc.ca/gov/content?id=A519A56BC2BF44E4A008B33FCF527F61
  terms_of_use: https://www2.gov.bc.ca/gov/content?id=D1EE0A405E584363B205CD4353E02C88
  declared_in_contract: true
  note: >-
    The licence is named in the first-party OpenAPI's info.license block, so a machine can
    read the reuse terms straight off the contract.
