kind: separate-environment
detail: >-
  DataBC names three environments in the contract itself rather than only in prose, which
  is rare for an open-data portal. The test catalogue is live and open to anonymous
  requests, so a client can rehearse against a non-production catalogue with no signup and
  no key. There are no test keys, test cards, fixtures, triggers or time-simulation tools —
  this is a read-mostly metadata API, and the sandbox is simply a second deployment.
