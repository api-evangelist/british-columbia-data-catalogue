  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
responseCodes:
  throttled: null
limits: []
detail: >-
  DataBC publishes no rate limits, quotas or throttling policy for the BC Data Catalogue
  API, and the API returns no rate-limit signalling of any kind. A HEAD against
  /api/3/action/package_list?limit=1 returned only content-type, content-length,
  cache-control, server (Werkzeug/1.0.0 Python/3.8.10) and the gateway's
  x-kong-upstream-latency / x-kong-proxy-latency. No RateLimit-*, X-RateLimit-* or
  Retry-After header was present, and no 429 was observed.
observed:
  - url: https://catalogue.data.gov.bc.ca/api/3/action/package_list?limit=1
    method: HEAD
    status: 200
    headers_seen:
      - content-type
      - content-length
      - cache-control
      - server
      - date
      - x-kong-upstream-latency
      - x-kong-proxy-latency
gateway:
  vendor: Kong
  evidence: x-kong-upstream-latency and x-kong-proxy-latency response headers
  note: >-
    The surface sits behind DataBC's Kong-based API management service, so throttling may
    exist at the gateway without being advertised. An agent has no runtime signal to back
    off on: it would discover a limit only by being cut off. Publishing RateLimit headers
    (RFC 9331 style) would be the single highest-value runtime addition here.
